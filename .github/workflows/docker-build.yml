name: Docker Build & Push

# 每次推送代码时自动构建并推送镜像
on:
    push:
        branches:
            - main
            - master
            - v3
    # 支持手动触发
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    REGISTRY: ghcr.io

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Normalize image name (lowercase)
              id: image
              run: |
                  IMG="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
                  echo "name=$IMG" >> "$GITHUB_OUTPUT"
                  echo "Full image: ${{ env.REGISTRY }}/$IMG"

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up QEMU (multi-platform support)
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  # 同时构建 amd64（x86服务器）和 arm64（树莓派/部分NAS）
                  platforms: linux/amd64,linux/arm64
                  # v3 分支用独立标签 :v3，latest 保留给 v4（v4-serverchan 的 workflow），避免互相覆盖
                  tags: |
                      ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:v3
                      ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
                  # 利用 GitHub Actions 缓存加速构建
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            # ghcr 包默认私有，NAS 上无鉴权 docker pull 会失败；推送成功后把包设为 public。
            # 推送后包注册可能有延迟，失败重试。
            - name: Make package public (for NAS pull without auth)
              run: |
                  PACKAGE="microsoft-rewards-script"
                  for i in $(seq 1 10); do
                      STATUS=$(curl -s -o /tmp/ghcr-vis.json -w "%{http_code}" -X PATCH \
                          -H "Authorization: Bearer $GITHUB_TOKEN" \
                          -H "Accept: application/vnd.github+json" \
                          -H "X-GitHub-Api-Version: 2022-11-28" \
                          "https://api.github.com/user/packages/container/${PACKAGE}" \
                          -d '{"visibility":"public"}')
                      if [ "$STATUS" = "200" ] || [ "$STATUS" = "204" ]; then
                          echo "ghcr 包已设为 public: ${PACKAGE}"
                          exit 0
                      fi
                      echo "第 ${i} 次尝试失败 (HTTP ${STATUS})，5 秒后重试..."
                      sleep 5
                  done
                  cat /tmp/ghcr-vis.json 2>/dev/null || true
                  exit 1
